services:
  - type: web
    name: pulse-price-tracker-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium
    startCommand: npm run start --workspace server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
